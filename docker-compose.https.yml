services:
  frontend:
    # `ports` is a concatenating merge key, so a plain `ports: []` would NOT remove
    # the base 8080 mapping — the site would stay reachable unencrypted on :8080.
    # !override (Compose v2.24+) replaces it outright so Caddy owns 80/443.
    ports: !override []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config: